name: Android APK Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate web app syntax
        run: |
          node --check app-features.js
          node --check premium-admin.js
          python -m py_compile backend/app.py backend/premium.py backend/init_db.py
          test -s android/app/src/main/res/drawable-nodpi/nur_premium_icon.webp
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Verify APK validity, signing and real launcher icon
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" | tee /tmp/signature-check.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/signature-check.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='uz.nuroqiworayi.app'" /tmp/apk-badging.txt
          grep -q "versionCode='3'" /tmp/apk-badging.txt
          grep -q "application-icon" /tmp/apk-badging.txt
          unzip -l "$APK" | tee /tmp/apk-filelist.txt
          grep -q "res/drawable-nodpi.*nur_premium_icon" /tmp/apk-filelist.txt
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nur-oqiw-orayi-premium-v0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nur-oqiw-orayi-preview-apk
          path: nur-oqiw-orayi-premium-v0.3.apk
          retention-days: 30
      - name: Publish preview release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-preview
          name: Nur oqiw orayi — premium app v0.3 with icon
          prerelease: true
          make_latest: false
          files: nur-oqiw-orayi-premium-v0.3.apk
          body: "Fresh Gradle build with transparent app icon, verified APK signing and icon resource. Preview release; not yet Google Play build."
