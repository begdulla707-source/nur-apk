name: Android APK Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "*.css"
      - "*.js"
      - "backend/**"
      - "tests/**"
      - "paynet_qr.png"
      - "android/app/google-services.json"
      - ".github/workflows/android-apk.yml"
concurrency:
  group: nur-oqiw-android-release-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate web app syntax
        run: |
          node --check app-features.js
          node --check premium-admin.js
          node --check ranking-ui.js
          node --check liquid-glass.js
          node --check i18n.js
          node --check contact-ui.js
          node --check payment-ui.js
          node --check portfolio-ui.js
          node --check notifications-ui.js
          node --check navigation-ui.js
          node --check math-ocr.js
          node --check math-portal.js
          node tests/math-ocr.test.js
          python -m py_compile backend/app.py backend/premium.py backend/ranking_plus.py backend/contact.py backend/payments.py backend/init_db.py
          test -s android/app/src/main/res/drawable-nodpi/nur_premium_icon.webp
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/i18n.js
          test -s android/app/google-services.json
          test -s android/app/src/main/assets/app-features.js
          grep -q 'id="admin-identity"' index.html
          grep -q 'adminVerified(true)' app-features.js
          test -s android/app/src/main/assets/liquid-glass.js
      - name: Sync latest app UI into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html features.css premium-admin.css ranking-ui.css liquid-glass.css polish-v08.css payment-ui.css portfolio-ui.css notifications-ui.css math-portal.css android/app/src/main/assets/
          cp paynet_qr.png android/app/src/main/assets/
          cp app-features.js premium-admin.js ranking-ui.js liquid-glass.js i18n.js contact-ui.js payment-ui.js portfolio-ui.js notifications-ui.js navigation-ui.js math-ocr.js math-portal.js android/app/src/main/assets/
          test -s android/app/src/main/assets/payment-ui.js
          test -s android/app/src/main/assets/paynet_qr.png
          test -s android/app/src/main/assets/contact-ui.js
          test -s android/app/src/main/assets/notifications-ui.js
          test -s android/app/src/main/assets/navigation-ui.js
          test -s android/app/src/main/assets/math-ocr.js
          test -s android/app/src/main/assets/math-portal.js
          test -s android/app/src/main/assets/math-portal.css
          test -s android/app/src/main/res/drawable/nur_launch_background.xml
          test -s android/app/src/main/assets/polish-v08.css
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Verify APK validity, signing and real launcher icon
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" | tee /tmp/signature-check.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/signature-check.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='uz.nuroqiworayi.app'" /tmp/apk-badging.txt
          grep -q "versionCode='22'" /tmp/apk-badging.txt
          grep -q "application-icon" /tmp/apk-badging.txt
          grep -q "application-label:'Nur oqiw'" /tmp/apk-badging.txt
          unzip -l "$APK" | tee /tmp/apk-filelist.txt
          grep -q "res/drawable-nodpi.*nur_premium_icon" /tmp/apk-filelist.txt
          grep -q "assets/index.html" /tmp/apk-filelist.txt
          grep -q "assets/i18n.js" /tmp/apk-filelist.txt
          grep -q "assets/liquid-glass.js" /tmp/apk-filelist.txt
          grep -q "assets/app-features.js" /tmp/apk-filelist.txt
          grep -q "assets/contact-ui.js" /tmp/apk-filelist.txt
          grep -q "assets/polish-v08.css" /tmp/apk-filelist.txt
          grep -q "assets/payment-ui.js" /tmp/apk-filelist.txt
          grep -q "assets/portfolio-ui.js" /tmp/apk-filelist.txt
          grep -q "assets/portfolio-ui.css" /tmp/apk-filelist.txt
          grep -q "assets/notifications-ui.js" /tmp/apk-filelist.txt
          grep -q "assets/notifications-ui.css" /tmp/apk-filelist.txt
          grep -q "assets/navigation-ui.js" /tmp/apk-filelist.txt
          grep -q "assets/math-ocr.js" /tmp/apk-filelist.txt
          grep -q "assets/math-portal.js" /tmp/apk-filelist.txt
          grep -q "assets/math-portal.css" /tmp/apk-filelist.txt
          grep -q "assets/paynet_qr.png" /tmp/apk-filelist.txt
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nur_oqiw.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nur-oqiw-installable-APK
          path: Nur_oqiw.apk
          retention-days: 30
      - name: Publish preview release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-22
          name: Nur oqiw
          prerelease: true
          make_latest: false
          files: Nur_oqiw.apk
          body: "Nur oqiw Android 1.0.11 preview: bundled ML Kit Latin OCR for selected JPG/PNG/WebP mathematics result-sheet images, conservative two-column name and score detection, manual admin review for OCR uncertainty and DQ/zero, Excel/CSV imports retained. Original gold launcher icon preserved. Debug-signed preview only; OCR accuracy depends on image quality and requires real-device verification."
