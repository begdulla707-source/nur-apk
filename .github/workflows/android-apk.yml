name: Android APK Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate web app syntax
        run: |
          node --check app-features.js
          python -m py_compile backend/app.py backend/init_db.py
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nur-oqiw-orayi-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nur-oqiw-orayi-preview-apk
          path: nur-oqiw-orayi-preview.apk
          retention-days: 30
      - name: Publish preview release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-preview
          name: Nur oqiw orayi — premium preview APK
          prerelease: true
          make_latest: false
          files: nur-oqiw-orayi-preview.apk
          body: "Preview build for testing. Not yet Play Store release."
