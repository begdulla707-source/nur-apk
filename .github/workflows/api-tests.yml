name: Backend API Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: nurapk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nurapk_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/nurapk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Validate backend syntax
        run: python -m compileall -q backend
      - name: Initialize disposable test database
        run: python -m backend.init_db
      - name: Run full API integration tests
        run: python -m unittest backend.test_api -v
