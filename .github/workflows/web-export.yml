name: Export Mobile HTML
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-export.yml"
      - "index.html"
      - "features.css"
      - "app-features.js"
      - "premium-admin.js"
      - "premium-admin.css"
      - "backend/**"
      - "liquid-glass.css"
      - "liquid-glass.js"
      - "ranking-ui.css"
      - "ranking-ui.js"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and source files
        run: |
          node --check app-features.js
          node --check premium-admin.js
          node --check ranking-ui.js
          node --check liquid-glass.js
          python -m py_compile backend/app.py backend/premium.py backend/ranking_plus.py backend/init_db.py
          test -s index.html
          test -s features.css
          test -s premium-admin.css
          test -s liquid-glass.css
          test -s ranking-ui.css
          grep -q 'ranking-ui.js' index.html
          grep -q 'liquid-glass.js' index.html
      - uses: actions/upload-artifact@v4
        with:
          name: nur-apk-mobile-html
          path: |
            index.html
            features.css
            app-features.js
            premium-admin.css
            premium-admin.js
            ranking-ui.css
            ranking-ui.js
            liquid-glass.css
            liquid-glass.js
          retention-days: 30
