name: Export Mobile HTML
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-export.yml"
      - "index.html"
      - "features.css"
      - "app-features.js"
      - "premium-admin.js"
      - "premium-admin.css"
      - "backend/**"
      - "tests/**"
      - "liquid-glass.css"
      - "liquid-glass.js"
      - "i18n.js"
      - "contact-ui.js"
      - "payment-ui.js"
      - "payment-ui.css"
      - "paynet_qr.png"
      - "polish-v08.css"
      - "portfolio-ui.css"
      - "portfolio-ui.js"
      - "notifications-ui.js"
      - "notifications-ui.css"
      - "navigation-ui.js"
      - "math-ocr.js"
      - "math-portal.js"
      - "math-portal.css"
      - "ranking-ui.css"
      - "ranking-ui.js"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and source files
        run: |
          node --check app-features.js
          node --check premium-admin.js
          node --check ranking-ui.js
          node --check liquid-glass.js
          node --check i18n.js
          node --check contact-ui.js
          node --check payment-ui.js
          node --check portfolio-ui.js
          node --check notifications-ui.js
          node --check navigation-ui.js
          node --check math-ocr.js
          node --check math-portal.js
          node tests/math-ocr.test.js
          python -m py_compile backend/app.py backend/premium.py backend/ranking_plus.py backend/contact.py backend/payments.py backend/init_db.py
          test -s index.html
          test -s features.css
          test -s premium-admin.css
          test -s liquid-glass.css
          test -s ranking-ui.css
          test -s polish-v08.css
          test -s payment-ui.css
          test -s portfolio-ui.css
          test -s notifications-ui.css
          test -s math-portal.css
          test -s paynet_qr.png
          grep -q 'ranking-ui.js' index.html
          grep -q 'liquid-glass.js' index.html
          grep -q 'i18n.js' index.html
          grep -q 'payment-ui.js' index.html
          grep -q 'portfolio-ui.js' index.html
          grep -q 'notifications-ui.js' index.html
          grep -q 'navigation-ui.js' index.html
          grep -q 'math-portal.js' index.html
      - uses: actions/upload-artifact@v4
        with:
          name: nur-apk-mobile-html
          path: |
            index.html
            features.css
            app-features.js
            premium-admin.css
            premium-admin.js
            ranking-ui.css
            ranking-ui.js
            liquid-glass.css
            liquid-glass.js
            i18n.js
            contact-ui.js
            polish-v08.css
            payment-ui.css
            payment-ui.js
            portfolio-ui.js
            portfolio-ui.css
            notifications-ui.js
            notifications-ui.css
            navigation-ui.js
            math-ocr.js
            math-portal.js
            math-portal.css
            paynet_qr.png
          retention-days: 30
