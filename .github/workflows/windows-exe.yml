name: Windows Setup EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-exe.yml"
permissions:
  contents: write
concurrency:
  group: nur-windows-release
  cancel-in-progress: true
jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate transparent Windows icon
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; im=Image.open('download-site/nur-logo.png').convert('RGBA'); square=Image.new('RGBA',(512,512),(0,0,0,0)); im.thumbnail((480,480),Image.Resampling.LANCZOS); square.alpha_composite(im,((512-im.width)//2,(512-im.height)//2)); square.save('download-site/icon.ico',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          if (!(Test-Path 'download-site/icon.ico')) { throw 'Windows icon missing' }
      - name: Install desktop dependencies
        working-directory: desktop
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\\electron-builder-cache
        run: |
          npm install --no-audit --no-fund
      - name: Build Windows setup wizard
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\\electron-builder-cache
        run: |
          npm run build:win
      - name: Validate output
        run: |
          $file = 'desktop/dist/Nur_Oqiw_Setup.exe'
          if (!(Test-Path $file)) { throw "EXE not created: $file" }
          $info = Get-Item $file
          if ($info.Length -lt 10000000) { throw 'EXE unexpectedly small' }
          Write-Output ("Windows setup: " + $info.FullName + " | bytes: " + $info.Length)
          $magic = [System.IO.File]::ReadAllBytes($file)
          if ($magic[0] -ne 77 -or $magic[1] -ne 90) { throw 'Not a valid Windows PE EXE' }
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Nur_Oqiw_Setup.exe" | Set-Content -Path 'desktop/dist/SHA256SUMS.txt' -Encoding ascii
          $signature = Get-AuthenticodeSignature -FilePath $file
          Write-Output ("Authenticode signature: " + $signature.Status)
          Write-Output ("SHA256: " + $sha)
          node -e "const p=require('./desktop/package.json'); if(p.build.nsis.oneClick!==false || p.build.nsis.allowToChangeInstallationDirectory!==true)process.exit(3)"
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nur-Oqiw-Windows-Setup
          path: |
            desktop/dist/Nur_Oqiw_Setup.exe
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows preview
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v1.1.0
          name: Nur Oqiw Windows Setup 1.1.0
          body: |
            Windows 10/11 x64 NSIS installer: Welcome, folder selection, Install, Finish.
            Optional desktop/Start-menu shortcuts and uninstaller. No admin elevation by default.
            Uses existing Nur APK PC dashboard and requires internet access.
            Without a trusted Authenticode code-signing certificate, browsers and Microsoft SmartScreen may warn.
            Verify the published SHA256SUMS.txt before installing.
          prerelease: true
          make_latest: false
          files: |
            desktop/dist/Nur_Oqiw_Setup.exe
            desktop/dist/SHA256SUMS.txt
