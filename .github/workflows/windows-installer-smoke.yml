name: Windows Installer Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer-smoke.yml"
permissions:
  contents: read
jobs:
  test-windows-setup:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download official released Windows setup
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/begdulla707-source/nur-apk/releases/download/pc-v1.1.1/'
          Invoke-WebRequest -Uri ($url + 'Nur_Oqiw_Setup.exe') -OutFile 'Nur_Oqiw_Setup.exe'
          Invoke-WebRequest -Uri ($url + 'SHA256SUMS.txt') -OutFile 'SHA256SUMS.txt'
          $record = (Get-Content 'SHA256SUMS.txt' -Raw).Trim()
          $expected = ($record -split '\s+')[0]
          $actual = (Get-FileHash 'Nur_Oqiw_Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Installer checksum mismatch" }
          Write-Output "Verified installer checksum: $actual"
      - name: Silent smoke install into custom chosen folder
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:LOCALAPPDATA 'NurOqiw-SmokeTest'
          $setup = (Resolve-Path 'Nur_Oqiw_Setup.exe').Path
          Write-Output "Custom installation directory: $install"
          $process = Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Output ("Installer failed: " + $process.ExitCode)
            Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-8)} -ErrorAction SilentlyContinue |
              Where-Object { $_.LevelDisplayName -eq 'Error' -and $_.Message -match 'Nur|Setup|System.dll|NSIS' } |
              Select-Object -First 4 -ExpandProperty Message | Write-Output
            throw "NSIS installer failed with code $($process.ExitCode)"
          }
          $exe = Join-Path $install 'Nur Oqiw Orayi.exe'
          if (!(Test-Path $exe)) { throw "Installed app missing at $exe" }
          $asar = Join-Path $install 'resources/app.asar'
          if (!(Test-Path $asar)) { throw "Packaged app.asar missing at $asar" }
          Write-Output "Custom-path installation and app package: OK"
      - name: Verify uninstaller works
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:LOCALAPPDATA 'NurOqiw-SmokeTest'
          $app = Join-Path $install 'Nur Oqiw Orayi.exe'
          $uninstall = Get-ChildItem -LiteralPath $install -Filter 'Uninstall *.exe' -File | Select-Object -First 1
          if (!$uninstall) { throw 'Uninstaller not found' }
          $process = Start-Process -FilePath $uninstall.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller error: $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $app) { throw 'Application file still exists after uninstall' }
          Write-Output "Uninstall: OK"
