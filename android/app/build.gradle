plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'uz.nuroqiworayi.app'
    compileSdk 35
    defaultConfig {
        applicationId 'uz.nuroqiworayi.app'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Core Firebase SDK only. We do not enable Analytics, Authentication or
// Firestore until the owner explicitly configures those services.
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-common'
}
