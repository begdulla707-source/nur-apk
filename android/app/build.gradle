plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'uz.nuroqiworayi.app'
    compileSdk 35
    defaultConfig {
        applicationId 'uz.nuroqiworayi.app'
        minSdk 24
        targetSdk 35
        // Phones use ARM; omit two large x86 OCR runtimes from the APK.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        versionCode 26
        versionName '1.0.16'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Preview APKs are signed with one generated-and-cached key.
    // This is intentionally NOT the production Google Play signing key.
    signingConfigs {
        debug {
            storeFile file('../../.signing/nur-oqiw-preview.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
}

// Core Firebase SDK only. We do not enable Analytics, Authentication or
// Firestore until the owner explicitly configures those services.
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-common'
    // Bundled on-device Latin text recognition: works without a paid OCR API.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
