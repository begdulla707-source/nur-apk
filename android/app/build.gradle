plugins { id 'com.android.application' }
android {
    namespace 'uz.nuroqiworayi.app'
    compileSdk 35
    defaultConfig {
        applicationId 'uz.nuroqiworayi.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
