<style>
:root{
  --bg:#031a22; --teal:#14a3b8; --deep:#0a5f78; --gold:#e7b93e; --ink:#f4fbfd;
  --glass:rgba(255,255,255,.10); --edge:rgba(255,255,255,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink); background:var(--bg); overflow:hidden;
  display:grid; place-items:center;
}
/* slow drifting light behind the glass */
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;background:var(--teal);left:-12vmax;top:-14vmax}
.o2{width:38vmax;height:38vmax;background:var(--deep);right:-10vmax;bottom:-12vmax;animation-delay:-6s}
.o3{width:18vmax;height:18vmax;background:var(--gold);opacity:.35;right:12vmax;top:8vmax;animation-delay:-11s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

.card{
  position:relative; width:min(92vw,560px); padding:clamp(28px,6vw,56px) clamp(22px,5vw,48px);
  text-align:center; border-radius:44px;
  background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 55%,rgba(255,255,255,.10));
  border:1px solid var(--edge);
  backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.45);
  animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}}

.icon{width:clamp(130px,34vw,190px);height:auto;display:block;margin:0 auto 26px;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.45)); animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

h1{margin:0;font-weight:800;font-size:clamp(34px,8.5vw,58px);line-height:1.05;letter-spacing:-.01em;
  display:flex;flex-wrap:wrap;justify-content:center;gap:0 .28em}
.w{display:inline-flex;overflow:hidden;padding-bottom:.08em}
.l{display:inline-block;transform:translateY(110%) rotate(8deg);filter:blur(6px);opacity:0;
  animation:letter .9s cubic-bezier(.2,.9,.25,1) forwards;animation-delay:calc(.45s + var(--i)*.06s)}
@keyframes letter{to{transform:none;filter:blur(0);opacity:1}}
/* light sweep across the title after it appears */
h1 .w{background:linear-gradient(100deg,var(--ink) 40%,var(--gold) 50%,var(--ink) 60%);
  background-size:300% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:sweep 5s ease-in-out 2s infinite}
h1 .w .l{-webkit-text-fill-color:transparent}
@keyframes sweep{0%{background-position:120% 0}60%,100%{background-position:-20% 0}}

.sub{margin:18px 0 34px;font-weight:500;font-size:clamp(14px,3.6vw,17px);color:rgba(244,251,253,.8);
  opacity:0;animation:fade 1s ease 1.5s forwards}
@keyframes fade{to{opacity:1}}

.btn{
  display:inline-flex;align-items:center;gap:12px;padding:17px 40px;border-radius:999px;
  font:700 17px/1 "Montserrat",system-ui,sans-serif;color:var(--ink);text-decoration:none;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.10));
  border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 12px 30px rgba(0,0,0,.35),0 0 0 0 rgba(231,185,62,.5);
  opacity:0;animation:fade 1s ease 1.9s forwards,pulse 3.2s ease-out 3s infinite;
  transition:transform .25s ease,background .25s ease;
}
.btn svg{width:22px;height:22px;flex:none}
.btn:hover{transform:translateY(-3px) scale(1.03);background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(231,185,62,.22))}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
@keyframes pulse{0%{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 12px 30px rgba(0,0,0,.35),0 0 0 0 rgba(231,185,62,.5)}
  70%,100%{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 12px 30px rgba(0,0,0,.35),0 0 0 22px rgba(231,185,62,0)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .l,.sub,.btn{opacity:1;transform:none;filter:none}
  h1 .w{background:none;-webkit-text-fill-color:var(--ink)}
}
</style>
</head>
